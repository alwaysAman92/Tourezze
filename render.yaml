services:
  # Backend API Service
  - type: web
    name: tourezze-backend
    runtime: node
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        fromDatabase:
          name: tourezze-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # Set this manually in Render dashboard

  # Frontend Service (Static Site)
  - type: web
    name: tourezze-frontend
    runtime: static
    buildCommand: cd Frontend && npm install && npm run build
    staticPublishPath: Frontend/dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tourezze-backend
          property: host

databases:
  - name: tourezze-db
    databaseName: tour-ezze
    user: tourezze-user
    plan: free