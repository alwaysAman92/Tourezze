services:
  # MongoDB Database (Managed by Render)
  # Create this separately as a Render Database

  # Backend API Service
  - type: web
    name: tourezze-backend
    runtime: docker
    buildCommand: docker build -t backend ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        fromDatabase:
          name: tourezze-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # Set this manually in Render dashboard

  # Frontend Service
  - type: web
    name: tourezze-frontend
    runtime: docker
    buildCommand: docker build -t frontend ./Frontend
    dockerfilePath: ./Frontend/Dockerfile
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: tourezze-backend
          property: host

databases:
  - name: tourezze-db
    databaseName: tour-ezze
    user: tourezze-user
    plan: free